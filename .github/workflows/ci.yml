name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

jobs:
  verificar:
    name: Verificar (lint, tests, build)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Validar nombres y numeración de las migraciones SQL
        run: npm run validate:migrations

      - name: Lint
        run: npm run lint

      - name: Tests con cobertura
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Subir el reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cobertura
          path: coverage/
          retention-days: 30

  migraciones:
    name: Aplicar migraciones a Supabase (staging)
    needs: verificar
    # Solo corre en push a develop, nunca en pull_request. Si además ya
    # están cargados los tres secrets del proyecto de staging, aplica las
    # migraciones; si no, el paso "Comprobar..." lo detecta y el resto de
    # los pasos se saltean solos (queda en gris, no en rojo) en vez de
    # romper el pipeline.
    # Nota: el contexto `secrets` no está permitido en el `if:` de un job
    # (GitHub Actions lo rechaza al validar el workflow), por eso la
    # comprobación de los secrets se hace en un paso, no acá arriba.
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar si están cargados los secrets del proyecto de staging
        id: secrets-staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_DB_PASSWORD" ] && [ -n "$SUPABASE_PROJECT_REF" ]; then
            echo "listos=true" >> "$GITHUB_OUTPUT"
          else
            echo "listos=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Descargar el código
        if: steps.secrets-staging.outputs.listos == 'true'
        uses: actions/checkout@v4

      - name: Instalar Supabase CLI
        if: steps.secrets-staging.outputs.listos == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Vincular el proyecto de Supabase
        if: steps.secrets-staging.outputs.listos == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Aplicar las migraciones pendientes
        if: steps.secrets-staging.outputs.listos == 'true'
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
